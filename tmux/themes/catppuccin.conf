# =============================================================================
# Catppuccin Mocha Theme for tmux
# =============================================================================
# A soothing pastel theme for the high-spirited!
# https://github.com/catppuccin/catppuccin
#
# This file defines the full Catppuccin Mocha palette and applies it to
# tmux's status bar, pane borders, message styling, and copy-mode highlights.
# Source this file from your tmux.conf:
#   source-file ~/.config/tmux/themes/catppuccin.conf
# =============================================================================


# -----------------------------------------------------------------------------
# Palette — Catppuccin Mocha
# -----------------------------------------------------------------------------
# Base tones (darkest to lightest backgrounds)
#   base     #1E1E2E   — primary background
#   mantle   #181825   — slightly darker, used for sidebars / secondary bg
#   crust    #11111B   — darkest tone
#
# Surface tones (elevated UI elements)
#   surface0 #313244
#   surface1 #45475A
#   surface2 #585B70
#
# Text tones
#   text     #CDD6F4  — primary foreground
#   subtext0 #A6ADC8  — muted / secondary text
#
# Accent colors
#   blue      #89B4FA
#   lavender  #B4BEFE
#   green     #A6E3A1
#   yellow    #F9E2AF
#   red       #F38BA8
#   pink      #F5C2E7
#   teal      #94E2D5
#   rosewater #F5E0DC
#   peach     #FAB387
# -----------------------------------------------------------------------------


# =============================================================================
# Status Bar — General
# =============================================================================

# Status bar background: base
set -g status-style "bg=#1E1E2E,fg=#CDD6F4"

# Refresh status every 10 seconds (keeps clock / git branch current with minimal CPU)
set -g status-interval 10

# Increase left/right section length so nothing gets truncated
set -g status-left-length 50
set -g status-right-length 140


# =============================================================================
# Status Bar — Left Section
# =============================================================================
# Layout:  [session-name]  window-list ...
#
# Session badge: lavender background, base foreground, bold
# Separator uses powerline-style arrow (requires Nerd Font)

set -g status-left "\
#[bg=#B4BEFE,fg=#1E1E2E,bold] #{session_name} \
#[bg=#1E1E2E,fg=#B4BEFE,nobold] "


# =============================================================================
# Status Bar — Window List (centre portion)
# =============================================================================

# Inactive windows: surface1 bg, subtext0 fg
set -g window-status-style "bg=#45475A,fg=#A6ADC8"
set -g window-status-format "  #I:#W  "

# Active window: blue bg, base fg, bold
set -g window-status-current-style "bg=#89B4FA,fg=#1E1E2E,bold"
set -g window-status-current-format "  #I:#W  "

# Separator between window tabs
set -g window-status-separator ""


# =============================================================================
# Status Bar — Right Section
# =============================================================================
# Layout:  ... git-branch | vim-tpipeline | battery | clock
#
# Git branch:  green fg (icon + branch name)
# Battery:     self-coloring, level first (red <=15% / peach <=35% / green
#              charging / text otherwise); the bolt icon signals charging.
#              Emits its own trailing separator and prints nothing at all on
#              machines without a battery, so no orphan separator is left
# Clock:       rosewater fg
# vim-tpipeline inserts Neovim status via #{pane_title} if available

set -g status-right "\
#[fg=#A6E3A1,bg=#1E1E2E]  #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '—') \
#[fg=#585B70]│ \
#[fg=#CDD6F4]#{?pane_title,#{pane_title} #[fg=#585B70]│ ,}\
#(~/.local/bin/tmux-battery)\
#[fg=#F5E0DC]  %H:%M \
#[fg=#45475A]  %d-%b "


# =============================================================================
# Pane Borders
# =============================================================================

# Inactive pane border: surface1
set -g pane-border-style "fg=#45475A"

# Active pane border: blue (matches the active window tab)
set -g pane-active-border-style "fg=#89B4FA"


# =============================================================================
# Message / Command Prompt Styling
# =============================================================================

# Messages (e.g., "Pane is dead", prefix prompts): yellow on base
set -g message-style "bg=#1E1E2E,fg=#F9E2AF,bold"

# Command-line input mode styling
set -g message-command-style "bg=#313244,fg=#CDD6F4"


# =============================================================================
# Copy / Visual Mode Highlighting
# =============================================================================

# Selection highlight in copy-mode-vi: surface2 bg, text fg
set -g mode-style "bg=#585B70,fg=#CDD6F4"


# =============================================================================
# Clock Mode
# =============================================================================

# Clock color when entering clock mode (prefix + t): blue
set -g clock-mode-colour "#89B4FA"


# =============================================================================
# Display-Panes Indicator Colors
# =============================================================================

# Active pane number: blue
set -g display-panes-active-colour "#89B4FA"

# Inactive pane numbers: surface1
set -g display-panes-colour "#45475A"
