# =============================================================================
# tmux Configuration
# =============================================================================
# A modern tmux setup with Catppuccin Mocha theme, vim-style keybindings,
# seamless Neovim integration, and persistent sessions via tmux-resurrect.
#
# Prerequisites:
#   • TPM (Tmux Plugin Manager): https://github.com/tmux-plugins/tpm
#   • MesloLGS Nerd Font (for powerline / icon glyphs)
#   • pbcopy (macOS) or xclip (Linux) for system clipboard
#
# Install TPM:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# After sourcing this file, press  prefix + I  to install plugins.
# =============================================================================


# =============================================================================
# General Settings
# =============================================================================

# --- Prefix key ---
# Remap prefix from Ctrl-b to Ctrl-a (closer to home row)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Terminal & true-color support ---
# Set default terminal to enable 256-color and italic support
set -g default-terminal "tmux-256color"

# Enable true color (24-bit) passthrough for terminals that support it.
# This is critical for Neovim / bat / delta to render themes correctly.
set -as terminal-overrides ',xterm-256color:Tc'

# --- Timing ---
# Eliminate escape-time delay. Without this, Neovim suffers a noticeable
# lag when pressing Escape to return to Normal mode.
set -sg escape-time 0

# --- Indexing ---
# Start window and pane numbering at 1 (0 is awkward on the keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed so there are no gaps
set -g renumber-windows on

# Auto-rename window title to current folder name
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# Cursor shape support (block in normal mode, line in insert mode inside Neovim)
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# --- Mouse ---
# Enable mouse for pane selection, resizing, and scrolling
set -g mouse on

# --- History ---
# Generous scrollback buffer (default is 2000)
set -g history-limit 50000

# --- Focus events & Display ---
# Forward focus events to applications (required by Neovim autoread)
set -g focus-events on

# Message display duration (2 seconds)
set -g display-time 2000


# =============================================================================
# Keybindings — Splits & Navigation
# =============================================================================

# --- Splits ---
# Horizontal split (top/bottom) — prefix + -
# Opens the new pane in the current working directory
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Vertical split (left/right) — prefix + \ (pipe key without shift)
# Opens the new pane in the current working directory
unbind %
bind \\ split-window -h -c "#{pane_current_path}"

# --- New window in current path ---
bind c new-window -c "#{pane_current_path}"

# --- Pane resizing (vim-style with Shift) ---
# prefix + H/J/K/L to resize in 5-cell increments
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Reload config ---
# prefix + r to reload this file and display a confirmation message
bind r source-file ~/.config/tmux/tmux.conf \; display-message "  tmux.conf reloaded!"

# --- Tmux Sessionizer (Prefix + f) ---
# Fuzzy-find a project directory and switch/create session on the fly
bind-key -r f run-shell -b "~/.local/bin/tmux-sessionizer"


# =============================================================================
# Vi Copy Mode & System Clipboard
# =============================================================================

# Use vi-style keybindings in copy mode
setw -g mode-keys vi

# v — begin visual selection (like Vim visual mode)
bind -T copy-mode-vi v send-keys -X begin-selection

# y — yank selection to system clipboard
# OS detection: use pbcopy on macOS, xclip on Linux
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# Mouse drag — automatically copy selection to system clipboard
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"


# =============================================================================
# vim-tmux-navigator — Seamless Navigation
# =============================================================================
# These bindings MUST come BEFORE TPM initialisation so they are not
# overridden by the vim-tmux-navigator plugin's own defaults.
#
# They detect whether the active pane is running Vim/Neovim and forward
# Ctrl-h/j/k/l to Vim if so, otherwise they perform tmux pane navigation.
# See: https://github.com/christoomey/vim-tmux-navigator

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Also allow Ctrl-h/j/k/l inside copy-mode-vi so scrolling doesn't break
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R


# =============================================================================
# Theme
# =============================================================================
# Source the extracted Catppuccin Mocha theme (status bar, borders, etc.)
source-file ~/.config/tmux/themes/catppuccin.conf


# =============================================================================
# TPM — Tmux Plugin Manager
# =============================================================================
# Install plugins with:  prefix + I
# Update plugins with:   prefix + U
# Remove plugins with:   prefix + alt + u

set -g @plugin 'tmux-plugins/tpm'              # Plugin manager itself
set -g @plugin 'tmux-plugins/tmux-sensible'     # Sensible defaults
set -g @plugin 'tmux-plugins/tmux-yank'         # System clipboard yank
set -g @plugin 'christoomey/vim-tmux-navigator' # Ctrl-h/j/k/l navigation
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persist sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'    # Auto-save / auto-restore sessions

# --- Resurrect settings ---
# Capture pane contents so scrollback is preserved on restore
set -g @resurrect-capture-pane-contents 'on'

# --- Continuum settings ---
# Automatically restore the last saved environment when tmux starts
set -g @continuum-restore 'on'

# --- Initialise TPM ---
# This line MUST remain at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
